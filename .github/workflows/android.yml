name: NoCap OS app

# The NoCap OS phone app (android/). Pull requests that touch it get a debug
# APK as a build artifact. After a NoCapOS release is published, the APK is
# attached to it as nocap-os.apk, so Settings -> Devices can link to
# releases/latest/download/nocap-os.apk.
#
# Unit tests and lint run first. The release APK and the Play bundle (.aab)
# are signed with the release key when these repository secrets exist:
# NOCAP_KEYSTORE_B64 (base64 of the .jks), NOCAP_KEYSTORE_PASSWORD,
# NOCAP_KEY_ALIAS, NOCAP_KEY_PASSWORD. Without them they fall back to the
# Android SDK's debug key (each runner makes its own, so an update may need
# the old app removed first). Secrets are never available to pull requests
# from forks, so those always use the debug key.
#
# The Release workflow publishes with the built-in token, which does not fire
# "release" events for other workflows; so this also runs after Release
# finishes (workflow_run) and uploads to that release's tag.

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the APK to the release
    steps:
      - uses: actions/checkout@v4
        with:
          # After Release: build exactly what it released.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build release APK and Play bundle
        working-directory: android
        env:
          NOCAP_KEYSTORE_B64: ${{ secrets.NOCAP_KEYSTORE_B64 }}
          NOCAP_KEYSTORE_PASSWORD: ${{ secrets.NOCAP_KEYSTORE_PASSWORD }}
          NOCAP_KEY_ALIAS: ${{ secrets.NOCAP_KEY_ALIAS }}
          NOCAP_KEY_PASSWORD: ${{ secrets.NOCAP_KEY_PASSWORD }}
        run: |
          if [ -n "$NOCAP_KEYSTORE_B64" ]; then echo "Signing with the release key"; else echo "No release key secrets: signing with the debug key"; fi
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk nocap-os.apk
          cp app/build/outputs/bundle/release/app-release.aab nocap-os.aab
          rm -rf app/build/signing
          # The in-app updater reads this to compare versions and check the download.
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          sha=$(sha256sum nocap-os.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$code" "$name" "$sha" > nocap-os.json
          cat nocap-os.json
          ls -la nocap-os.apk nocap-os.aab nocap-os.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-and-test-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: nocap-os-apk
          path: |
            android/nocap-os.apk
            android/nocap-os.aab
            android/nocap-os.json
          if-no-files-found: error

      - name: Attach to the NoCapOS release
        if: github.event_name == 'release' || github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="v$(cat VERSION)"
          fi
          echo "Uploading nocap-os.apk, nocap-os.aab and nocap-os.json to $tag"
          gh release upload "$tag" android/nocap-os.apk android/nocap-os.aab android/nocap-os.json --clobber --repo "${{ github.repository }}"
