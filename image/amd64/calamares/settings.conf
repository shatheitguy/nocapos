# NoCapOS graphical installer (Calamares, Debian's package and helpers).
# Debian's own steps and order, in NoCapOS's look; the last job puts the
# NoCapOS layer in place (post-install.sh, shared with the text installer).
# build.sh copies this tree to /etc/calamares in the live system.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: nocapos
    module: shellprocess
    config: shellprocess-nocapos.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - dpkg-unsafe-io
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - plymouthcfg
      - initramfscfg
      - initramfs
      - dpkg-unsafe-io-undo
      - sources-media-unmount
      - sources-final
      - shellprocess@nocapos
      - umount
  - show:
      - finished

branding: nocapos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
