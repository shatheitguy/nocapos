# User step: the account made here is in the sudo group, so it is also a
# NoCapOS administrator (NoCapOS signs in with the machine's Linux
# accounts). No root password, like Debian with sudo. The machine is called
# "nocap" (nocap.local on the network).
---
userGroup: users
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  nonempty: true
  minLength: -1
  maxLength: -1
  libpwquality:
    - minlen=0
    - minclass=0
allowWeakPasswords: false
user:
  shell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "nocap"
