# Boot loader: Debian's GRUB (with its signed shim for Secure Boot). The
# EFI folder must stay "debian": Debian's signed GRUB looks for its
# configuration there. The menu itself says NoCapOS (GRUB_DISTRIBUTOR and
# theme from /etc/default/grub.d/nocapos.cfg).
---
efiBootLoader: "grub"
efiBootloaderId: "debian"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
