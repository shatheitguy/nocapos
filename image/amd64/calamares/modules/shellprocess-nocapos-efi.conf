# UEFI PCs: Debian's signed boot loader (shim and signed GRUB, so Secure
# Boot works) and the tool that adds the boot entry, from the install
# medium, before the boot loader is put in place. Nothing on BIOS PCs.
# Runs inside the new system; the packages stay installed there.
---
dontChroot: false
timeout: 600
script:
  - command: "[ ! -d /sys/firmware/efi ] || DEBIAN_FRONTEND=noninteractive apt-get -y -q install grub-efi-amd64 grub-efi-amd64-signed shim-signed efibootmgr"
    timeout: 600
