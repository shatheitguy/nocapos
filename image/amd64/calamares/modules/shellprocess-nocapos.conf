# NoCapOS: makes the copied live system an installed NoCapOS (Debian's
# package sources, NoCapOS's services and first-boot setup, live leftovers
# removed, boot menu). Runs inside the new system.
---
dontChroot: false
timeout: 1800
script:
  - command: "/usr/lib/nocapos/image/post-install.sh calamares"
    timeout: 1800
