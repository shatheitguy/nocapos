# Live-only packages leave the installed system (post-install.sh also
# cleans up their settings and anything they pulled in).
---
backend: apt
skip_if_no_internet: false
update_db: false
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - gnome-shell-extension-desktop-icons-ng
      - calamares-settings-debian
      - calamares
