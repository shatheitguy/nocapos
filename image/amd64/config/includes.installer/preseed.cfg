# NoCapOS installer (debian-installer). Loaded automatically from the
# installer's initrd. Questions not answered here (language, keyboard,
# disk layout, your user name and password) are asked as usual.

# Branding
d-i debian-installer/title string NoCapOS installer

# Network: the machine is called "nocap" (reachable as nocap.local).
d-i netcfg/get_hostname string nocap
d-i netcfg/hostname string nocap
d-i netcfg/get_domain string

# Package sources: Debian's archive, its security archive and stable updates,
# so security and kernel updates keep coming from Debian.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# Users: no root password. The first user (the installer asks for the name
# and password) gets sudo, and signs in to NoCapOS with the same account.
d-i passwd/root-login boolean false
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo

# Software: the live system already carries NoCapOS; nothing extra.
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader and splash.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i debian-installer/add-kernel-opts string quiet splash

# Make sure NoCapOS's first-boot setup runs on the installed system.
d-i preseed/late_command string in-target sh -c 'rm -f /var/lib/nocapos/.image-firstboot-done; systemctl enable nocapos.service nocapos-firstboot.service nocapos-setup-hint.service; /usr/lib/nocapos/image/os-release-sync; update-grub || true'
