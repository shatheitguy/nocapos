# NoCapOS container template settings, read by nocapos-firstboot.service.
# Docker for the App Store is already installed; it needs the container's
# "nesting" and "keyctl" features on the host. Turn it on at first boot: yes | no
NOCAP_DOCKER=yes
# Options for the bundled installer on the first boot. A container has no
# screen, so NoCap Desktop stays off (see: bash /usr/lib/nocapos/bundle/install.sh --help).
NOCAP_FIRSTBOOT_ARGS="--no-desktop"
