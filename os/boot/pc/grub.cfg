# NoCapOS PC boot (GRUB, first stage, on the startup partition). Rugix's
# A/B boot selection (the same logic as Rugix's own first.grub.cfg), made
# silent: nothing is shown from power-on until the NoCap boot splash.
# Holding Shift while the machine starts shows the boot menu instead.

set rugpi_bootpart=2
set rugpi_boot_spare=false
set RUGPI_SPARE_ENV=(${root})/rugpi/boot_spare.grubenv

# Text is drawn black on black: the checks below print a line each.
set color_normal=black/black
set color_highlight=black/black
set menu_color_normal=black/black
set menu_color_highlight=black/black

function verify_and_load {
    env_file="${1}"
    sha1_file="${1}.sha1"
    hashsum --hash sha1 --check "${sha1_file}"
    if [ $? != 0 ]; then
        return 1
    else
        load_env -f "${env_file}"
        return 0
    fi
}

verify_and_load "(${root})/rugpi/secondary.grubenv"
verify_and_load "(${root})/rugpi/primary.grubenv"
load_env -f "${RUGPI_SPARE_ENV}"

regexp (.*),(.*) $root -s 1:rugpi_root_device
export rugpi_root_device rugpi_bootpart

# ---- the boot menu (Shift held)
if keystatus --shift; then
    set color_normal=light-gray/black
    set color_highlight=white/red
    set menu_color_normal=light-gray/black
    set menu_color_highlight=white/red
    set timeout=-1
    menuentry "NoCapOS" {
        set root=(${rugpi_root_device},${rugpi_bootpart})
        source (${root})/grub.cfg
    }
    menuentry "NoCapOS (the other system, once)" {
        if [ "${rugpi_bootpart}" = "2" ]; then set rugpi_bootpart=3; else set rugpi_bootpart=2; fi
        set root=(${rugpi_root_device},${rugpi_bootpart})
        source (${root})/grub.cfg
    }
    menuentry "Firmware settings" {
        fwsetup
    }
    menuentry "Restart" {
        reboot
    }
else
if [ "${rugpi_boot_spare}" = "true" ]; then
    if [ "${rugpi_bootpart}" = "2" ]; then
        set rugpi_bootpart=3
    elif [ "${rugpi_bootpart}" = "3" ]; then
        set rugpi_bootpart=2
    fi
    set rugpi_boot_spare=false
    save_env -f "${RUGPI_SPARE_ENV}" rugpi_boot_spare
    set rugpi_boot_spare=true
fi

if [ "${rugpi_bootpart}" = "2" ]; then
    set rugpi_syspart=4
elif [ "${rugpi_bootpart}" = "3" ]; then
    set rugpi_syspart=5
fi

set root=(${rugpi_root_device},${rugpi_bootpart})

if [ -f (${root})/grub.cfg ]; then
    source (${root})/grub.cfg
fi

# Only reached when the system's boot files are missing.
set color_normal=light-gray/black
echo "NoCapOS couldn't start. Restarting in 10 seconds (Esc for a GRUB shell)."
sleep --verbose --interruptible 10
if [ $? = 0 ]; then
    reboot
fi
fi
