# NoCap Desktop: the compositor's settings for every account's session
# (written by NoCapOS to /usr/share/nocapos/wayfire; replaced on updates).
# Wayfire draws the windows with real blur behind NoCap OS's glass and
# animates them, like the web OS. Where it can't start (no usable graphics
# card), the session runs labwc instead (/usr/share/nocapos/labwc).
# Keys follow NoCap OS: Super opens the app launcher, Super+A the control
# center, Super+L locks, Alt+Tab switches windows, Super+arrows snap.

[core]
plugins = alpha animate autostart blur command decoration foreign-toplevel grid gtk-shell idle move place resize session-lock shortcuts-inhibit switcher wayfire-shell window-rules wm-actions xdg-activation
xwayland = true
vwidth = 1
vheight = 1
background_color = \#0c0d10ff
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_button_with_modifier = false
preferred_decoration_mode = client
max_render_time = -1

[input]
kb_repeat_rate = 25
kb_repeat_delay = 600
natural_scroll = true
tap_to_click = true
disable_touchpad_while_typing = true
cursor_theme = Adwaita
cursor_size = 24

[autostart]
autostart_wf_shell = false
# The session's services: NoCap Shell (desktop, top bar, dock, launcher),
# the idle lock, the clipboard agent. The same script as on labwc.
nocap = /usr/share/nocapos/labwc/autostart

# NoCap OS's own app windows are glass: what's behind them shows through,
# blurred, as in the browser. Other apps' windows are drawn as they are.
[blur]
blur_by_default = app_id contains "nocapos"
method = kawase
kawase_offset = 4
kawase_degrade = 3
kawase_iterations = 3
saturation = 1.6

# Windows zoom in and out; panels fade. Quick, like the web OS.
[animate]
open_animation = zoom
close_animation = zoom
duration = 220ms circle
zoom_duration = 220ms circle
fade_duration = 160ms linear
fade_enabled_for = type equals "overlay"
zoom_enabled_for = type equals "toplevel" | (type equals "x-or" & focusable equals true)
startup_duration = 400ms linear

# Other apps' title bars, in NoCap's colours. NoCap OS's own windows draw
# their own title bar (the same one as in the browser).
[decoration]
font = sans-serif bold 9
title_height = 28
border_size = 0
button_order = minimize maximize close
active_color = \#18191eff
inactive_color = \#141519ff
ignore_views = app_id contains "nocapos"

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 300

[wm-actions]
toggle_maximize = <super> KEY_UP
minimize = <super> KEY_DOWN

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = none
restore = none
duration = 200ms circle

# The screen's idle lock and screen blanking are swayidle's (NoCap's
# settings); the compositor's own stay off.
[idle]
screensaver_timeout = -1
dpms_timeout = -1
disable_on_fullscreen = true

[command]
release_binding_launcher = <super>
command_launcher = /usr/libexec/nocapos/nocap-shell --toggle launcher
binding_launcher2 = <super> KEY_SPACE
command_launcher2 = /usr/libexec/nocapos/nocap-shell --toggle launcher
binding_center = <super> KEY_A | <super> KEY_N
command_center = /usr/libexec/nocapos/nocap-shell --toggle center
binding_lock = <super> KEY_L
command_lock = /usr/libexec/nocapos/nocap-lock
binding_files = <super> KEY_E
command_files = /usr/libexec/nocapos/nocap-open files
binding_terminal = <ctrl> <alt> KEY_T | <super> KEY_T
command_terminal = /usr/libexec/nocapos/nocap-open terminal
binding_settings = <super> KEY_I
command_settings = /usr/libexec/nocapos/nocap-open settings
binding_screenshot = KEY_SYSRQ
command_screenshot = /usr/libexec/nocapos/nocap-open screenshot
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = /usr/libexec/nocapos/nocap-shell --osd volume-up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = /usr/libexec/nocapos/nocap-shell --osd volume-down
binding_mute = KEY_MUTE
command_mute = /usr/libexec/nocapos/nocap-shell --osd volume-mute
repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = /usr/libexec/nocapos/nocap-shell --osd brightness-up
repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = /usr/libexec/nocapos/nocap-shell --osd brightness-down
